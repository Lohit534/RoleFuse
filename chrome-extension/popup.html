<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoleFuse AI - Job Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FFFFFF;
      color: #111827;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #E5E7EB;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 20px;
      height: 20px;
      background: #087F6E;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      background: #F0FDF4;
      color: #087F6E;
      border: 1px solid #D1FAE5;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #087F6E;
      background: #F2FBF9;
      border: 1px solid #CCF0EA;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 12px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #087F6E;
    }
    .field {
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
      display: block;
    }
    input, textarea {
      width: 100%;
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: #111827;
      font-family: inherit;
    }
    textarea {
      height: 80px;
      resize: none;
      line-height: 1.4;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #087F6E;
      background: #FFFFFF;
      box-shadow: 0 0 0 2px rgba(8, 127, 110, 0.15);
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      transition: all 0.15s ease;
    }
    .btn-teal {
      background: #087F6E;
      color: #FFFFFF;
    }
    .btn-teal:hover {
      background: #065F53;
    }
    .btn-black {
      background: #111827;
      color: #FFFFFF;
    }
    .btn-black:hover {
      background: #000000;
    }
    .btn-outline {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      color: #111827;
    }
    .btn-outline:hover {
      background: #F9FAFB;
      border-color: #CBD5E1;
    }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #F1F5F9;
      text-align: center;
      font-size: 10px;
      color: #64748B;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">R</div>
      <div class="brand-name">RoleFuse AI</div>
    </div>
    <span class="badge">Commercial</span>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span id="statusText">Scanning active tab...</span>
  </div>

  <div class="field">
    <label class="label">Job Title</label>
    <input type="text" id="jobTitle" placeholder="e.g. Senior Software Engineer">
  </div>

  <div class="field">
    <label class="label">Company Name</label>
    <input type="text" id="company" placeholder="e.g. Stripe, Google, Amazon">
  </div>

  <div class="field">
    <label class="label">Job Description</label>
    <textarea id="jobDescription" placeholder="Extracted job description will populate here automatically..."></textarea>
  </div>

  <button id="captureBtn" class="btn btn-outline" type="button">
    ⚡ Re-Capture from Current Tab
  </button>

  <button id="coverLetterBtn" class="btn btn-teal" type="button">
    ✍️ Open in Cover Letter Studio
  </button>

  <button id="optimizeBtn" class="btn btn-black" type="button">
    🎯 Tailor Resume with RoleFuse
  </button>

  <div class="footer">
    100% Client-Side Security &bull; Zero Private Data Tracked
  </div>

  <script src="popup.js"></script>
</body>
</html>
